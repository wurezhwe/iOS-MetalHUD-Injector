name: Release IPA

on:
  workflow_run:
    workflows: ["Build IPA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish the built IPA as a release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout (for project.yml)
        uses: actions/checkout@v4
        with:
          sparse-checkout: project.yml
          sparse-checkout-cone-mode: false

      - name: Resolve the source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=1&status=success" \
                        --jq '.workflow_runs[0].id')"
          else
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "using run $RUN_ID"

      - name: Download the IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.src.outputs.run_id }}" \
             --repo "${{ github.repository }}" \
             --name MetalHUDLauncher-ipa \
             --dir dist
          ls -lh dist

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^\s+MARKETING_VERSION:' project.yml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "error: MARKETING_VERSION not found in project.yml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing v$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_ID: ${{ steps.src.outputs.run_id }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Unsigned \`MetalHUDLauncher.ipa\`, version ${VERSION}.

          Install it with SideStore, AltStore, TrollStore or any signing service —
          the archive carries no certificate or provisioning profile.

          **Before launching anything:** run a loopback VPN (LocalDevVPN, or the
          WireGuard profile SideStore installs), pair from
          Settings > Privacy & Security > Developer Mode, then pick an app in the
          launcher.

          Built by workflow run ${RUN_ID}.
          EOF
          )"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/MetalHUDLauncher.ipa \
              --repo "${{ github.repository }}" --clobber
            printf '%s\n' "$NOTES" > /tmp/notes.md
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "Metal HUD Launcher ${VERSION}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" dist/MetalHUDLauncher.ipa \
              --repo "${{ github.repository }}" \
              --title "Metal HUD Launcher ${VERSION}" \
              --notes "$NOTES" \
              --latest
          fi
